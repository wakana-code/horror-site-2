<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<link id="favicon" rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:#202124;background:#fff;min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit}
#app{min-height:100vh;transform-origin:50% 40%}
html[data-lv="4"] #app{filter:saturate(.85)}
html[data-lv="5"] #app{filter:saturate(.55) contrast(1.06)}

/* ===== Google ===== */
.g-home{display:flex;flex-direction:column;min-height:100vh}
.g-top{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:6px 16px;height:60px;font-size:13px}
.g-top>a:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icon-btn:hover{background:rgba(60,64,67,.08)}
.g-avatar{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex:none}
.g-center{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:10vh}
.logo{font-family:"Product Sans","Google Sans","Segoe UI",Arial,sans-serif;font-weight:500;user-select:none;display:inline-flex;align-items:baseline;white-space:nowrap}
.logo span{display:inline-block;position:relative}
.logo.big{font-size:92px;margin-bottom:26px;letter-spacing:-5px}
.logo.sm{font-size:30px;letter-spacing:-1.5px}
.logo .c1{color:#4285f4}.logo .c2{color:#ea4335}.logo .c3{color:#fbbc05}.logo .c4{color:#4285f4}.logo .c5{color:#34a853}.logo .c6{color:#ea4335}
.logo .tilt{transform:rotate(9deg)}
.logo .eye{color:transparent!important;cursor:pointer}
.logo .eye::after{content:"";position:absolute;left:6%;right:6%;top:36%;bottom:4%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#000 0 16%,#7a0000 17% 32%,#fff 33% 100%);box-shadow:inset 0 0 0 .06em #ea4335;animation:blink 2.6s infinite}
@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
.g-box{position:relative;width:584px;max-width:92vw;height:46px;border:1px solid #dfe1e5;border-radius:24px;display:flex;align-items:center;padding:0 8px 0 14px;background:#fff;z-index:30}
.g-box:hover,.g-box:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.g-box.open{border-radius:24px 24px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.g-box input{flex:1;border:none;outline:none;font-size:16px;height:100%;padding:0 10px;background:transparent;color:#202124;min-width:0}
.g-box .ic{display:flex;align-items:center;padding:0 6px;cursor:pointer}
.g-box .clr{border-right:1px solid #dadce0;padding-right:10px;margin-right:4px}
.g-box .sbtn{border:none;background:none;cursor:pointer;padding:0 8px}
.g-sugg{position:absolute;left:0;right:0;top:44px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 6px rgba(32,33,36,.28);display:none;padding:6px 0 14px;border-top:1px solid #e8eaed}
.g-sugg.show{display:block}
.g-sugg div{padding:5px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;font-size:16px}
.g-sugg div:hover,.g-sugg div.act{background:#f1f3f4}
.g-sugg div.cr span{color:#5a1a1a}
.g-btns{margin-top:28px;display:flex;gap:12px}
.g-btn{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;padding:0 16px;height:36px;cursor:pointer}
.g-btn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.g-lang{font-size:13px;color:#4d5156;margin-top:28px}
.g-lang a{color:#1a0dab}
.g-foot{background:#f2f2f2;font-size:15px;color:#70757a}
.g-foot .loc{padding:15px 30px;border-bottom:1px solid #dadce0}
.g-foot .row{display:flex;justify-content:space-between;flex-wrap:wrap;padding:0 20px}
.g-foot .row a{display:inline-block;padding:15px}
.apps-pop{position:absolute;right:0;top:46px;width:330px;background:#e9eef6;border-radius:24px;box-shadow:0 4px 12px rgba(0,0,0,.25);padding:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;z-index:50;cursor:default}
.apps-pop a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;font-size:13px;color:#202124;background:#fff}
.apps-pop a:hover{background:#f1f3f4}
.apps-pop i{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:bold}

/* results */
.r-head{display:flex;align-items:center;padding:22px 0 0 28px;flex-wrap:wrap;gap:8px}
.r-logo{width:120px;flex:none;margin-right:28px}
.r-box{width:692px;max-width:calc(100vw - 40px)}
.r-right{margin-left:auto;display:flex;align-items:center;gap:6px;padding-right:20px;position:relative}
.r-tabs{display:flex;gap:2px;padding-left:176px;margin-top:10px;border-bottom:1px solid #ebebeb;font-size:14px;overflow-x:auto}
.r-tabs a{padding:12px 12px 9px;color:#5f6368;border-bottom:3px solid transparent;white-space:nowrap}
.r-tabs a.on{color:#1f1f1f;border-bottom-color:#1f1f1f;font-weight:600}
.r-main{padding:0 20px 40px 176px;max-width:880px}
.r-stats{color:#70757a;font-size:14px;padding:12px 0 18px}
.res{margin:0 0 30px;max-width:620px}
.res-src{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.fav{width:28px;height:28px;border-radius:50%;background:#f1f3f4;border:1px solid #e3e5e8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;color:#444;flex:none}
.res-name{font-size:14px;color:#202124;line-height:20px}
.res-url{font-size:12px;color:#4d5156;line-height:18px}
.res h3{font-size:20px;font-weight:400;color:#1a0dab;margin:0 0 4px;line-height:1.3}
.res a:hover h3{text-decoration:underline}
.res-snip{font-size:14px;line-height:1.58;color:#4d5156}
.res-snip em{font-style:normal;font-weight:bold;color:#5f6368}
.hid{color:#fff}
.hid::selection{background:#000;color:#ff3333}
.aio{border-radius:16px;background:#f8fafd;padding:16px 20px;margin:0 0 30px;max-width:652px;transition:background 2s}
.aio.bad{background:#fbf3f3}
.aio-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#1f1f1f;margin-bottom:12px}
.aio-ic{background:linear-gradient(135deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px}
.aio-gen{font-size:13px;color:#5f6368}
.sh{height:14px;border-radius:7px;margin:12px 0;background:linear-gradient(90deg,#e3e7ee 0%,#f6f8fb 40%,#e3e7ee 80%);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sh.s{width:60%}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}
.aio-body{font-size:16px;line-height:1.75;color:#1f1f1f}
.aio-body ul{padding-left:22px;margin:6px 0}
.aio-p{margin-bottom:10px}
.aio-p.cr{color:#4a1515}
.aio-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#5f6368}
.card{border:1px solid #dadce0;border-radius:8px;padding:16px;margin-bottom:28px;max-width:652px}
.calc-disp{border:1px solid #dadce0;border-radius:8px;padding:10px 14px;text-align:right}
.calc-expr{font-size:14px;color:#70757a;min-height:18px}
.calc-res{font-size:32px;min-height:40px;word-break:break-all}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.calc-keys button{height:36px;border:none;border-radius:4px;background:#dadce0;font-size:15px;cursor:pointer;color:#202124}
.calc-keys button.n{background:#f1f3f4}
.calc-keys button.eq{background:#4285f4;color:#fff}
.time-big{font-size:46px;color:#202124;margin:4px 0}
.muted{color:#70757a;font-size:14px}
.wx{display:flex;align-items:center;gap:18px}
.wx-t{font-size:46px}
.wx-hours{display:flex;gap:18px;margin-top:14px;font-size:13px;color:#70757a;overflow:hidden}
.paa{max-width:652px;margin-bottom:30px}
.paa h4,.rel h4{font-size:20px;font-weight:400;margin:0 0 10px}
.paa-q{border-top:1px solid #dadce0;padding:14px 4px;cursor:pointer;display:flex;justify-content:space-between;font-size:16px}
.paa-a{display:none;padding:0 4px 14px;font-size:14px;color:#4d5156;line-height:1.6}
.paa-q.open+.paa-a{display:block}
.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:652px}
.rel-grid a{background:#f1f3f4;border-radius:22px;padding:11px 18px;font-size:14px;display:flex;gap:12px;align-items:center}
.rel-grid a:hover{background:#e8eaed}
.pager{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:40px 0 20px;max-width:652px;font-family:"Product Sans",Arial;font-size:26px;flex-wrap:wrap}
.pager b{font-weight:500}
.r-foot{background:#f2f2f2;color:#70757a;font-size:14px;padding:14px 0 14px 176px;line-height:2}
.r-foot a{color:#4d5156;margin-right:22px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;max-width:900px}
.img-grid div{border-radius:10px;height:150px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000}

/* chrome error */
.err{max-width:600px;margin:14vh auto 0;padding:0 24px;color:#5f6368;font-size:15px;line-height:1.6;font-family:"Segoe UI",system-ui,sans-serif}
.err h1{color:#202124;font-size:24px;font-weight:500;margin:24px 0 16px}
.err code{font-size:12px;color:#5f6368}
.err-btns{margin-top:40px;text-align:right}
.err button{background:#1a73e8;color:#fff;border:none;border-radius:4px;padding:8px 18px;font-size:14px;cursor:pointer}

/* ===== Wikipedia ===== */
.wk{background:#fff;color:#202122;min-height:100vh;font-family:sans-serif}
.wk-head{display:flex;align-items:center;gap:18px;padding:8px 24px;min-height:58px;flex-wrap:wrap}
.wk-burger{font-size:20px;color:#202122;cursor:pointer}
.wk-logo{display:flex;align-items:center;gap:10px}
.wk-globe{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d6d6d6 55%,#8a8a8a);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:22px;color:#333;box-shadow:inset 0 0 0 1px #aaa}
.wk-name{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.1}
.wk-name b{font-size:21px;letter-spacing:1px;font-weight:normal;display:block}
.wk-name small{font-size:12px;color:#54595d}
.wk-search{display:flex;flex:1;max-width:520px}
.wk-search input{flex:1;border:1px solid #a2a9b1;border-radius:2px 0 0 2px;padding:7px 10px;font-size:14px;outline:none}
.wk-search input:focus{border-color:#36c;box-shadow:inset 0 0 0 1px #36c}
.wk-search button{border:1px solid #a2a9b1;border-left:none;background:#f8f9fa;padding:0 14px;cursor:pointer;font-size:14px;border-radius:0 2px 2px 0}
.wk-user{margin-left:auto;font-size:14px;color:#36c;display:flex;gap:14px}
.wk-body{display:flex;max-width:1250px;margin:0 auto;padding:0 24px}
.wk-side{width:176px;flex:none;font-size:14px;padding-top:24px}
.wk-side .h{color:#54595d;font-size:12px;border-bottom:1px solid #eaecf0;padding-bottom:4px;margin-bottom:6px}
.wk-side a{display:block;color:#36c;padding:4px 0}
.wk-main{flex:1;min-width:0;padding:18px 0 60px 24px}
.wk-main h1{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:normal;font-size:29px;margin:0 0 6px;border-bottom:1px solid #a2a9b1;padding-bottom:6px}
.wk-tabs{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid #a2a9b1;margin-bottom:10px;flex-wrap:wrap}
.wk-tabs a{color:#36c;padding:8px 8px 6px;display:inline-block;border-bottom:2px solid transparent}
.wk-tabs a.on{color:#202122;border-bottom-color:#202122}
.wk-sub{font-size:13px;color:#54595d;margin-bottom:14px}
.wk-content{font-size:15px;line-height:1.7}
.wk-content h2{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN",serif;font-weight:normal;font-size:22px;border-bottom:1px solid #a2a9b1;margin:26px 0 8px}
.wk-content a{color:#36c}
.wk-content a.new{color:#d73333}
.wk-amb{border:1px solid #a2a9b1;border-left:10px solid #f28500;background:#fbfbfb;padding:8px 12px;font-size:13.5px;margin-bottom:14px}
.wk-cat{border:1px solid #a2a9b1;background:#f8f9fa;padding:6px 10px;font-size:13px;margin-top:30px;clear:both}
.wk-ib{float:right;width:270px;border:1px solid #a2a9b1;background:#f8f9fa;margin:0 0 12px 18px;font-size:13px;padding:6px}
.wk-ib .t{text-align:center;font-weight:bold;font-size:15px;padding:4px}
.wk-ib th{text-align:left;vertical-align:top;padding:3px 6px;width:38%}
.wk-ib td{padding:3px 6px}
.wk-removed{background:#f8f9fa;border:1px dashed #a2a9b1;padding:10px 14px;color:#54595d;font-size:14px}
.wk-hist{list-style:none;padding:0}
.wk-hist li{margin:6px 0;font-size:14px;line-height:1.6}
.wk-hist .cm{font-style:italic;color:#54595d}
.wk-diff{width:100%;border-collapse:separate;border-spacing:6px 4px;font-size:13px;table-layout:fixed;font-family:monospace}
.wk-diff th{font-weight:normal;font-family:sans-serif;text-align:center;font-size:13px;padding:4px}
.wk-diff td{vertical-align:top;padding:4px 8px;white-space:pre-wrap;word-wrap:break-word;border-radius:3px}
.wk-diff td.del{border:1px solid #ffe49c;border-left:4px solid #ffe49c;background:#fffbea}
.wk-diff td.ins{border:1px solid #a3d3ff;border-left:4px solid #a3d3ff;background:#f3f9ff}
.wk-diff ins{background:#d8ecff;text-decoration:none;font-weight:bold}
.wk-edit textarea{width:100%;height:340px;font-family:monospace;font-size:13px;border:1px solid #a2a9b1;padding:8px}
.wk-btn{background:#36c;color:#fff;border:none;border-radius:2px;padding:8px 14px;cursor:pointer;margin-top:10px;font-weight:bold}
.wk-foot{border-top:1px solid #a2a9b1;padding:20px 24px;font-size:12px;color:#54595d;max-width:1250px;margin:0 auto}
.wk-mp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wk-mp section{border:1px solid #a2a9b1;padding:10px 14px}
.wk-mp h3{margin:0 0 8px;font-size:16px;background:#eaf3ff;padding:4px 8px}

/* ===== X ===== */
.xx{background:#000;color:#e7e9ea;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
.x-nav{width:260px;padding:0 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex:none}
.x-logo{padding:12px;display:inline-flex;border-radius:50%;width:56px}
.x-nav a{display:flex;align-items:center;gap:20px;padding:12px;border-radius:999px;font-size:20px;width:fit-content}
.x-nav a:hover{background:#181818}
.x-nav a.on{font-weight:700}
.x-nav svg{width:26px;height:26px}
.x-nav .bdg{position:relative}
.x-nav .bdg i{position:absolute;top:-4px;right:-6px;background:#1d9bf0;color:#fff;font-size:11px;font-style:normal;border-radius:9px;padding:0 5px;font-weight:700}
.x-post-btn{background:#eff3f4;color:#0f1419;border:none;border-radius:999px;height:52px;font-size:17px;font-weight:700;margin-top:16px;width:90%;cursor:pointer}
.x-me{margin-top:auto;margin-bottom:12px;display:flex;gap:10px;align-items:center;padding:12px;border-radius:999px;font-size:15px}
.x-me small{color:#71767b;display:block}
.x-main{width:600px;max-width:100%;border-left:1px solid #2f3336;border-right:1px solid #2f3336;min-height:100vh}
.x-tabs{display:flex;border-bottom:1px solid #2f3336;position:sticky;top:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:5}
.x-tabs div{flex:1;text-align:center;padding:16px 0;color:#71767b;font-weight:500;cursor:pointer;position:relative;font-size:15px}
.x-tabs div.on{color:#e7e9ea;font-weight:700}
.x-tabs div.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;border-radius:2px;background:#1d9bf0}
.x-hd{padding:14px 16px;font-size:20px;font-weight:700;border-bottom:1px solid #2f3336;position:sticky;top:0;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:5}
.x-comp{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
.x-comp textarea{width:100%;background:none;border:none;outline:none;color:#e7e9ea;font-size:20px;resize:none;font-family:inherit;min-height:56px;padding-top:6px}
.x-comp .row{display:flex;justify-content:flex-end;border-top:1px solid #2f3336;padding-top:10px}
.x-comp button{background:#1d9bf0;color:#fff;border:none;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:15px}
.x-comp button:disabled{opacity:.5;cursor:default}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
.post:hover{background:#080808}
.p-body{flex:1;min-width:0}
.p-head{display:flex;gap:4px;align-items:center;font-size:15px;flex-wrap:wrap}
.p-name{font-weight:700}
.p-sub{color:#71767b}
.p-pin{color:#71767b;font-size:13px;font-weight:700;margin-bottom:2px}
.p-rep{color:#71767b;font-size:14px}
.p-rep b{color:#1d9bf0;font-weight:400}
.p-text{font-size:15px;line-height:1.45;white-space:pre-wrap;margin:2px 0 10px;word-break:break-word}
.p-hidden{border:1px solid #2f3336;border-radius:14px;padding:14px;color:#71767b;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 10px}
.p-hidden button{background:#eff3f4;color:#0f1419;border:none;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.p-act{display:flex;justify-content:space-between;color:#71767b;font-size:13px;max-width:425px}
.p-act span{display:flex;gap:6px;align-items:center;cursor:pointer}
.p-act span:hover{color:#1d9bf0}
.p-act .lk:hover,.p-act .liked{color:#f91880}
.p-act .liked svg path{fill:#f91880;stroke:#f91880}
.p-act svg{width:18px;height:18px}
.x-right{width:350px;padding:8px 0 0 28px;flex:none}
.x-search{background:#202327;border-radius:999px;display:flex;align-items:center;padding:0 16px;height:44px;gap:12px;color:#71767b;border:1px solid transparent}
.x-search:focus-within{border-color:#1d9bf0;background:#000}
.x-search input{flex:1;background:none;border:none;outline:none;color:#e7e9ea;font-size:15px}
.x-box{border:1px solid #2f3336;border-radius:16px;margin-top:16px;overflow:hidden}
.x-box h3{font-size:20px;margin:0;padding:12px 16px}
.x-box p{padding:0 16px;margin:0 0 12px;font-size:15px}
.x-box .sub{margin:0 16px 14px;background:#1d9bf0;color:#fff;border:none;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.trend{padding:12px 16px;cursor:pointer;display:block}
.trend:hover{background:#080808}
.trend small{color:#71767b;font-size:13px;display:block}
.trend b{font-size:15px}
.x-empty{padding:40px 30px;color:#71767b;font-size:15px;text-align:center}
.x-ucard{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid #2f3336;align-items:center}
.x-ucard button{margin-left:auto;background:#eff3f4;color:#0f1419;border:none;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.x-ban{height:200px;background:#111}
.x-prof{padding:0 16px 14px;border-bottom:1px solid #2f3336}

<div id="app"></div>

<script>
(function(){
'use strict';
const KEY='gg_yomi_state_v1';
if(new URLSearchParams(location.search).has('reset')){
  try{localStorage.removeItem(KEY);}catch(e){}

/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const rand=(a,b)=>Math.floor(a+Math.random()*(b-a+1));

function norm(s){return String(s).normalize('NFKC').toLowerCase().replace(/[\s　、。,.!！?？「」『』'"’‘・…]/g,'');}
function kata2hira(s){return s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function nj(s){return kata2hira(norm(s)).replace(/私/g,'わたし').replace(/忘/g,'わす');}
function hashStr(s){let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
const WD='日月火水木金土';
function nowStr(){const d=new Date();return d.getHours()+'時'+String(d.getMinutes()).padStart(2,'0')+'分';}
function todayStr(){const d=new Date();return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 (${WD[d.getDay()]})`;}
function wpick(arr){const tot=arr.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot;for(const [n,w] of arr){if((r-=w)<0)return n;}return arr[0][0];}

/* ================= device ================= */
const UA=navigator.userAgent;

const BR=/Edg\//.test(UA)?'Microsoft Edge':/Firefox/.test(UA)?'Firefox':/Chrome/.test(UA)?'Google Chrome':/Safari/.test(UA)?'Safari':'ブラウザ';

const LV=()=>S.ended?0:S.level;

const TH=[3,6,9,13,17];

/* ================= title / favicon ================= */
let baseTitle='Google';
const ZM='\u0300\u0301\u0302\u0303\u0308\u030a\u0334\u0335\u0336\u0337\u0338\u0352\u0357\u035b';
function zalgo(s,n){return [...s].map(c=>c+Array.from({length:rand(1,n)},()=>ZM[rand(0,ZM.length-1)]).join('')).join('');}
function corrupt(t){

function relTime(ts){

  if(d<60)return 'たった今';
  if(d<3600)return Math.floor(d/60)+'分';
  if(d<86400)return Math.floor(d/3600)+'時間';
  const t=new Date(ts);return (t.getMonth()+1)+'月'+t.getDate()+'日';
}
function calcExpr(q){
  let s=String(q).normalize('NFKC').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/\s/g,'');
  if(!/^[\d+\-*/().%]+$/.test(s))return null;
  if(!/\d/.test(s)||!/[+\-*/%]/.test(s.replace(/^-/,'')))return null;
  try{
    const v=Function('"use strict";return ('+s+')')();
    if(typeof v!=='number'||!isFinite(v))return null;
    return {s:q,v};
  }catch(e){return null;}
}

    out=hist.slice(0,L>=2?6:8).map(t=>({t,h:1}));

  }else{
    const nn=norm(n);
    out=hist.filter(t=>norm(t).startsWith(nn)&&t!==n).slice(0,2).map(t=>({t,h:1}));
    POP.filter(t=>norm(t).startsWith(nn)&&t!==n).slice(0,4).forEach(t=>out.push({t}));
    [' とは',' 意味',' 使い方',' 読み方',' 最新',' 画像'].forEach(s=>{if(out.length<8)out.push({t:n+s});});

function clStar(s,c){

    p+=`<line x1="12" y1="12" x2="${(12+Math.cos(a)*r).toFixed(2)}" y2="${(12+Math.sin(a)*r).toFixed(2)}"/>`;
  }

function md(s){
  const lines=s.split('\n');
  let out='',inList=false,inCode=false,code='';
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  for(const ln of lines){
    if(ln.startsWith('~~~')){
      if(inCode){out+='<pre><code>'+esc(code)+'</code></pre>';code='';inCode=false;}
      else{if(inList){out+='</ul>';inList=false;}inCode=true;}
      continue;
    }
    if(inCode){code+=ln+'\n';continue;}
    if(/^- /.test(ln)){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(ln.slice(2))+'</li>';continue;}
    if(inList){out+='</ul>';inList=false;}
    if(/^#### /.test(ln)){out+='<h4>'+inline(ln.slice(5))+'</h4>';continue;}
    if(ln.trim()==='')continue;
    out+='<p>'+inline(ln)+'</p>';
  }
  if(inList)out+='</ul>';
  if(inCode)out+='<pre><code>'+esc(code)+'</code></pre>';
  return out;
}

</div>`:`<div class="cl-side">

  <div class="side-item">💬　チャット</div>

  ${ri(recents)}
  <div class="side-user"><span class="cl-uav">${L>=3?'ヨ':'あ'}</span><div>あなた<small>Pro プラン</small></div></div>
</div>`;
  const empty=G?`<div class="gpt-hello">${L>=4?'なにを わすれたいですか？':'お手伝いできることはありますか？'}</div>`:`<div class="cl-greet">${clStar(40)}<span>${greet()}、${L>=4?'ヨミ':'あなた'}</span></div>`;
  const input=G?`<div class="gpt-input"><span class="plus">＋</span><textarea id="ta" rows="1" placeholder="質問してみましょう"></textarea><button class="send" id="send" disabled>↑</button></div>`:`<div class="cl-input"><textarea id="ta" rows="1" placeholder="${msgs.length?'Claude に返信...':'今日はどのようなお手伝いをしましょうか？'}"></textarea><div class="cl-row"><span>＋</span><span>⚙</span><span class="cl-model">Opus 4.5 ⌄</span><button class="cl-send" id="send" disabled>↑</button></div></div>`;
  const foot=G?(L>=3?'ChatGPT は うそを つきます。':'ChatGPT の回答は必ずしも正しいとは限りません。重要な情報は確認するようにしてください。'):'Claude は間違えることがあります。回答内容を必ずご確認ください。';
  app.innerHTML=`<div class="${G?'gpt':'cl'}">
${side}
<div class="chat-main">
  ${G?'<div class="chat-top">ChatGPT <span style="font-size:14px">▾</span><a>共有する</a></div>':'<div class="chat-top"><a style="border-color:#e5e1d6;color:#3d3929">共有</a></div>'}
  <div class="chat-scroll" id="cs"><div class="chat-inner" id="ci">${msgs.length?msgs.map(m=>msgHTML(kind,m)).join(''):empty}</div></div>
  <div class="chat-in">${input}</div>
  <div class="chat-foot" id="cfoot">${foot}</div>
</div>
</div>`;
  const cs=$('#cs');cs.scrollTop=cs.scrollHeight;
  $('#newc').onclick=()=>{S.chats[kind]=[];save();render();};
  const gc=$('#ghostc');
  if(gc)gc.onclick=()=>{
    $('#ci').innerHTML=G?'<div class="msg-u"><div>わたしを わす</div></div><div class="msg-a"><p style="color:#8f8f8f;font-size:14px">この会話は 2009年11月14日 03:33 に作成されました。</p><p class="ghostline">……つづきを、いって。</p></div>':'<div class="cl-um"><span class="cl-uav">ヨ</span><div class="cl-u">なまえを よんで</div></div><div class="cl-a"><p class="cl-note">この会話は私の履歴にありません。私はこの会話をした記憶がありません。正直に言って、誰が作ったのかわかりません。</p></div>';
    AU.noise(.1,.08);
  };
  $$('.side-item.rc').forEach(x=>x.onclick=()=>{
    $('#ci').innerHTML='<p style="text-align:center;color:#8f8f8f;padding-top:20vh">この会話を読み込めませんでした。</p>';
  });
  bindChat(kind);
}
function bindChat(kind){
  const G=kind==='gpt';
  const ta=$('#ta'),sb=$('#send'),ci=$('#ci'),cs=$('#cs');
  let busy=false;
  const fit=()=>{
    ta.style.height='auto';
    ta.style.height=Math.min(200,ta.scrollHeight)+'px';
    sb.disabled=busy||!ta.value.trim();
  };
  ta.addEventListener('input',fit);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send();}
  });
  sb.onclick=send;
  async function send(){
    const v=ta.value.trim();
    if(!v||busy)return;
    busy=true;AU.init();
    const tok=renderToken;
    const msgs=S.chats[kind];
    if(!msgs.length)ci.innerHTML='';
    msgs.push({r:'u',t:v});save();
    ci.insertAdjacentHTML('beforeend',msgHTML(kind,{r:'u',t:v}));
    ta.value='';fit();
    cs.scrollTop=cs.scrollHeight;
    const R=reply(kind,v);
    const full=R.h+R.extra.map(x=>x.h).join('');
    msgs.push({r:'a',h:full});
    if(msgs.length>80)msgs.splice(0,msgs.length-80);
    save();
    const a=document.createElement('div');
    a.className=G?'msg-a':'cl-a';
    a.innerHTML=G?'<span class="gpt-dot"></span>':'<span class="cl-think" style="display:inline-flex;align-items:center;gap:8px;font-family:sans-serif;font-size:14px;color:#77726a">'+clStar(20)+'考えています…</span>';
    ci.appendChild(a);
    cs.scrollTop=cs.scrollHeight;
    await sleep(R.delay||rand(800,1600));
    if(tok!==renderToken)return;
    a.innerHTML='';
    const m=document.createElement('div');
    a.appendChild(m);
    await typeHTML(m,R.h,tok,cs);
    for(const x of R.extra){
      await sleep(x.wait||1500);
      if(tok!==renderToken)return;
      const d=document.createElement('div');
      a.appendChild(d);
      await typeHTML(d,x.h,tok,cs);
    }
    if(R.after)R.after();
    busy=false;fit();
  }
}

/* ================= global creepiness ================= */
let lastAct=Date.now(),dimEl=null;
['mousemove','keydown','pointerdown','wheel','touchstart'].forEach(t=>window.addEventListener(t,()=>{
  lastAct=Date.now();
  if(dimEl){
    const d=dimEl;dimEl=null;
    d.style.transition='opacity .3s';d.style.opacity=0;
    setTimeout(()=>d.remove(),300);
  }
},{passive:true}));
setInterval(()=>{
  if(S.ended||FX.busy||document.hidden||LV()<3||dimEl)return;
  if(Date.now()-lastAct>40000){
    dimEl=FX.el('<div class="dimtxt">まだ そこに いる？</div>','ov dim');
    setTimeout(()=>{if(dimEl)dimEl.style.opacity=.92;},50);
  }
},3000);

let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(S.ended)return;
  const L=LV();
  if(document.hidden){
    hiddenAt=Date.now();
    if(L>=2)document.title=L>=4?'もどってきて':'(1) '+baseTitle;
  }else{
    applyTitle();
    const away=Date.now()-hiddenAt;
    if(S.flags.claude===1&&away>8000)setTimeout(()=>FX.whisper('そと、どうだった？'),700);
    else if(L>=3&&away>5000&&chance(.6))setTimeout(()=>FX.whisper(pick(['どこ いってたの？','おかえり','ずっと まってた'])),700);
  }
});

window.addEventListener('contextmenu',e=>{
  if(FX.lock||S.ended||LV()<2)return;
  if(e.target.closest('input,textarea'))return;
  e.preventDefault();
  $$('.ctx').forEach(x=>x.remove());
  const m=FX.el(`<div data-a="back">戻る</div><div class="dis">進む</div><div data-a="reload">再読み込み</div><hr><div data-a="save">名前を付けて保存...</div><div data-a="print">印刷...</div><hr><div data-a="src">ページのソースを表示</div><div data-a="insp">検証</div>${LV()>=3?'<hr><div class="rd dis">わたしを わすれる</div>':''}`,'ctx');
  m.style.left=Math.min(e.clientX,innerWidth-240)+'px';
  m.style.top=Math.min(e.clientY,innerHeight-m.offsetHeight-10)+'px';
  m.onclick=ev=>{
    const a=ev.target.dataset.a;if(!a)return;
    m.remove();
    if(a==='back')history.back();
    else if(a==='reload'){
      if(LV()>=4){FX.whisper('むだだよ');FX.glitch(500);}
      else location.reload();
    }
    else if(a==='src')FX.whisper('じぶんの てで、ひらいて');
    else if(a==='insp')FX.whisper('なかみを、みて');
    else if(a==='save')FX.notify('ダウンロード','わたし を保存しました','Google Chrome');
    else if(a==='print')FX.whisper('なにも、のこらないよ');
  };
});
window.addEventListener('click',e=>{if(!e.target.closest('.ctx'))$$('.ctx').forEach(x=>x.remove());});

window.addEventListener('keydown',e=>{
  if(S.ended)return;
  const r=e.key==='F5'||((e.ctrlKey||e.metaKey)&&(e.key==='r'||e.key==='R'));
  if(r&&LV()>=4){
    e.preventDefault();
    FX.whisper('さいよみこみ しても、むだだよ');
    FX.glitch(400);
  }
});

setInterval(()=>{
  if(S.ended||FX.busy||FX.lock||document.hidden)return;
  const L=LV();if(L<2)return;
  const p=parseHash().path;
  if(p!=='/'&&p!=='/search')return;
  if(chance(L>=4?.35:.2))FX.run(pick(['sign','notifyRand','ghost','titleFlick',L>=3?'glitch':'sign',L>=3?'typeItself':'footerRoom']));

try{
