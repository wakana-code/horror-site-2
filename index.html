
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<link id="favicon" rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;color:#202124;background:#fff;min-height:100vh}
a{color:inherit;text-decoration:none;cursor:pointer}
button{font-family:inherit}
svg{display:block}

/* ===== Google Home ===== */
.g-home{display:flex;flex-direction:column;min-height:100vh}
.g-top{display:flex;justify-content:flex-end;align-items:center;gap:15px;padding:6px 16px;height:60px;font-size:13px}
.g-top a:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{background:rgba(60,64,67,.08)}
.g-avatar{width:32px;height:32px;border-radius:50%;background:#7b1fa2;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
.g-avatar.dark{background:radial-gradient(circle at 50% 36%,#1a1a1a 0 20%,transparent 21%),radial-gradient(ellipse at 50% 100%,#1a1a1a 0 45%,#000 46%);box-shadow:0 0 0 2px #2a0000}
.g-center{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:calc$22vh - 60px$}
.glogo{font-family:"Product Sans","Google Sans",Arial,sans-serif;user-select:none;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.glogo.big{font-size:92px;margin-bottom:28px}
.glogo.small{font-size:29px}
.glogo span{display:inline-block;transition:color .3s,transform .15s}
.glogo.puzzle span{cursor:pointer}
.glogo.puzzle span:hover{transform:translateY$-3px$}
.puz-hint{font-size:12px;color:#9aa0a6;margin:-16px 0 18px;letter-spacing:.2em}
.g-form{position:relative;width:584px;max-width:92vw}
.g-box{display:flex;align-items:center;height:46px;border:1px solid #dfe1e5;border-radius:24px;padding:0 8px 0 14px;background:#fff;position:relative;z-index:21}
.g-box:hover,.g-form.focus .g-box{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:rgba(223,225,229,0)}
.g-form.open .g-box{border-radius:24px 24px 0 0;box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.g-box input{flex:1;border:none;outline:none;font-size:16px;padding:0 12px;height:100%;background:transparent;color:#202124;font-family:inherit;min-width:0}
.g-ico{display:flex;align-items:center;padding:0 7px;cursor:pointer}
.g-clear{display:none;padding:0 10px;border-right:1px solid #dadce0;cursor:pointer;color:#70757a;font-size:22px;line-height:1}
.g-sugg{position:absolute;left:0;right:0;top:46px;background:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 6px rgba(32,33,36,.28);z-index:20;overflow:hidden;display:none;padding:4px 0 16px;border-top:1px solid #e8eaed}
.g-form.open .g-sugg{display:block}
.sg-item{display:flex;align-items:center;gap:14px;padding:6px 20px;font-size:16px;cursor:pointer;color:#202124}
.sg-item:hover,.sg-item.act{background:#f1f3f4}
.sg-item b{font-weight:700}
.sg-item.creep{color:#5f6368}
.g-btns{display:flex;justify-content:center;gap:12px;margin-top:29px}
.g-btn{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;height:36px;padding:0 16px;cursor:pointer}
.g-btn:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1);color:#202124}
.g-lang{font-size:13px;margin-top:28px;color:#4d5156}
.g-lang a{color:#1a0dab;margin-left:6px}
.shortcuts{display:flex;gap:4px;margin-top:30px;flex-wrap:wrap;justify-content:center;max-width:600px}
.sc{width:112px;height:112px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-size:13px;color:#202124}
.sc:hover{background:#f1f3f4}
.sc-ic{width:48px;height:48px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.sc.creep .sc-ic{background:#000}
.sc.creep span{color:#888}
.g-thanks{margin-top:26px;font-size:13px;color:#9aa0a6;letter-spacing:.15em;animation:fadein 4s}
.g-foot{background:#f2f2f2;font-size:15px;color:#70757a;position:relative}
.g-foot1{padding:15px 30px;border-bottom:1px solid #dadce0}
.g-foot2{display:flex;justify-content:space-between;flex-wrap:wrap;padding:0 20px}
.g-foot2 div{display:flex;flex-wrap:wrap}
.g-foot2 a{padding:15px;cursor:pointer}
.g-foot2 a:hover{text-decoration:underline}
.g-menu{position:absolute;bottom:52px;right:20px;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:8px 0;min-width:220px;z-index:50}
.g-menu div{padding:10px 20px;font-size:14px;color:#202124;cursor:pointer}
.g-menu div:hover{background:#f1f3f4}

/* ===== Search Results ===== */
.sr-head{display:flex;align-items:center;padding:20px 24px 0 28px}
.sr-logo{width:150px;flex-shrink:0;display:flex;align-items:center}
.sr-form{width:692px;max-width:calc$100vw - 320px$}
.sr-form .g-clear{display:block}
.sr-right{margin-left:auto;display:flex;align-items:center;gap:8px;padding-left:20px}
.sr-tabs{display:flex;gap:4px;padding:12px 0 0 168px;border-bottom:1px solid #ebebeb;font-size:14px;overflow-x:auto}
.sr-tab{padding:8px 12px 10px;color:#5f6368;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.sr-tab:hover{color:#202124}
.sr-tab.on{color:#1f1f1f;font-weight:700;border-color:#1f1f1f}
.sr-body{padding:8px 0 60px 180px;max-width:860px}
.sr-stats{font-size:14px;color:#70757a;padding:8px 0 16px}
.sr-stats .cr{color:#b3261e}
.res{margin-bottom:30px;max-width:652px}
.res-top{display:flex;align-items:center;gap:12px;margin-bottom:4px;cursor:pointer;width:fit-content}
.res-fav{width:28px;height:28px;border-radius:50%;background:#f1f3f4;border:1px solid #ecedef;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden;flex-shrink:0}
.res-site{font-size:14px;color:#202124;line-height:20px}
.res-url{font-size:12px;color:#4d5156;line-height:18px}
.res-title{font-size:20px;color:#1a0dab;line-height:26px;cursor:pointer;display:inline-block;margin:3px 0 3px}
.res-title:hover{text-decoration:underline}
.res-title.visited{color:#681da8}
.res-snip{font-size:14px;color:#4d5156;line-height:22px}
.res-snip .dt{color:#70757a}
.res-snip .fut{color:#b3261e}
.sitelinks{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin:12px 0 0 20px}
.sitelinks a{color:#1a0dab;font-size:16px}
.sitelinks a:hover{text-decoration:underline}
.sitelinks p{margin:2px 0 0;font-size:13px;color:#4d5156}
.res.tsu .res-title{color:#1a0dab}
.res.tsu{animation:fadein 3s}
.ai{border-radius:16px;background:linear-gradient(180deg,#f3f6fc,#fff 70%);padding:16px 20px 18px;margin:0 0 28px;max-width:652px;border:1px solid #e9eef6}
.ai-h{display:flex;align-items:center;gap:8px;font-size:14px;color:#1f1f1f;margin-bottom:10px;font-weight:600}
.ai-gen{font-size:13px;color:#5f6368;margin:4px 0 8px}
.sh{height:14px;border-radius:7px;background:linear-gradient(90deg,#e8f0fe 0%,#c6d9fb 35%,#e8f0fe 70%);background-size:200% 100%;animation:shm 1.4s linear infinite;margin:12px 0}
@keyframes shm{to{background-position:-200% 0}}
.ai-body{font-size:16px;line-height:27px;color:#1f1f1f}
.ai-body p{margin:0 0 12px;animation:fadein .6s}
.ai-body ul{margin:0 0 12px;padding-left:22px;animation:fadein .6s}
.ai-body .ghostline{color:#5f6368}
.ai-src{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-chip{border:1px solid #dadce0;border-radius:12px;padding:8px 12px;font-size:12px;cursor:pointer;max-width:220px;background:#fff;color:#1f1f1f}
.ai-chip:hover{background:#f8f9fa}
.ai-foot{font-size:12px;color:#70757a;margin-top:12px}
.paa{max-width:652px;margin-bottom:30px}
.paa h3{font-size:20px;font-weight:400;margin:0 0 10px}
.paa-q{border-top:1px solid #dadce0;padding:14px 4px;font-size:16px;display:flex;justify-content:space-between;cursor:pointer}
.paa-q:last-child{border-bottom:1px solid #dadce0}
.paa-a{display:none;font-size:14px;color:#4d5156;line-height:22px;padding:0 4px 14px}
.paa-a.on{display:block}
.rel{max-width:652px;margin-bottom:30px}
.rel h3{font-size:20px;font-weight:400;margin:0 0 12px}
.rel-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-c{background:#f1f3f4;border-radius:24px;padding:12px 18px;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
.rel-c:hover{background:#e8eaed}
.pager{display:flex;align-items:flex-start;gap:0;margin:30px 0 0 0;font-family:"Product Sans",Arial,sans-serif;user-select:none}
.pg-l{font-size:30px;line-height:1;text-align:center;letter-spacing:-.05em}
.pg-o{font-size:30px;line-height:1;text-align:center;cursor:pointer;color:#fbbc05;width:20px}
.pg-o small{display:block;font-size:13px;color:#1a0dab;font-family:Arial,sans-serif;margin-top:8px}
.pg-o.cur{color:#ea4335;cursor:default}
.pg-o.cur small{color:#202124;font-weight:700}
.pg-next{font-size:13px;color:#1a0dab;margin-left:14px;margin-top:38px;cursor:pointer}
.wx,.tm{border:1px solid #dadce0;border-radius:8px;padding:18px 20px;max-width:652px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-start}
.wx-l{display:flex;align-items:flex-start;gap:12px}
.wx-ic{font-size:48px;line-height:1;color:#fbbc05}
.wx-t{font-size:46px;line-height:1}
.wx-u{font-size:16px;margin-top:4px}
.wx-d{font-size:12px;color:#70757a;line-height:20px;margin-left:10px}
.wx-r{text-align:right;font-size:14px;color:#70757a;line-height:22px}
.wx-r .h{font-size:20px;color:#202124}
.tm{flex-direction:column}
.tm-big{font-size:56px;color:#202124;font-family:Arial,sans-serif}
.tm-d{font-size:14px;color:#70757a;margin-top:8px}
.imgs{columns:4 180px;column-gap:14px;padding-right:24px;max-width:1100px}
.img{break-inside:avoid;margin-bottom:16px;cursor:pointer}
.img-p{border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;letter-spacing:.3em}
.img-c{font-size:13px;color:#202124;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-s{font-size:12px;color:#70757a}

/* ===== Generic site ===== */
.site-h{padding:16px 24px;color:#fff;font-weight:700;font-size:18px}
.site-w{max-width:720px;margin:0 auto;padding:30px 24px 80px;font-size:16px;line-height:1.95;color:#333}
.site-w h1{font-size:26px;line-height:1.5;color:#222}
.site-meta{font-size:13px;color:#888;margin-bottom:24px}
.site-back{display:inline-block;margin-top:30px;color:#1a0dab;font-size:14px}
.b-creep{background:#0b0b0b}
.site-creep{max-width:640px;margin:0 auto;padding:16vh 24px;color:#9a9a9a;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2.3;letter-spacing:.12em}
.site-creep h1{color:#ccc;font-weight:400;font-size:22px}
.site-creep .u{font-family:monospace;color:#555;font-size:12px}

/* ===== X ===== */
.b-x{background:#000;color:#e7e9ea}
.x{display:flex;justify-content:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",Meiryo,sans-serif}
.x-nav{width:275px;padding:0 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;flex-shrink:0}
.x-logo{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin:2px 0;cursor:pointer}
.x-logo:hover{background:#181818}
.x-ni{display:flex;align-items:center;gap:20px;padding:12px;border-radius:999px;font-size:20px;cursor:pointer;width:fit-content}
.x-ni:hover{background:#181818}
.x-ni.on{font-weight:700}
.x-pbtn{background:#eff3f4;color:#0f1419;font-weight:700;font-size:17px;border:none;border-radius:999px;height:52px;width:90%;margin-top:16px;cursor:pointer}
.x-me{margin-top:auto;margin-bottom:12px;display:flex;align-items:center;gap:12px;padding:12px;border-radius:999px;cursor:pointer}
.x-me:hover{background:#181818}
.x-me small{color:#71767b;display:block}
.x-main{width:600px;border-left:1px solid #2f3336;border-right:1px solid #2f3336;min-height:100vh;flex-shrink:0}
.x-mh{position:sticky;top:0;background:rgba(0,0,0,.65);backdrop-filter:blur(12px);border-bottom:1px solid #2f3336;z-index:5}
.x-tabs{display:flex}
.x-tabs div{flex:1;text-align:center;padding:16px 0;color:#71767b;font-weight:500;cursor:pointer;position:relative;font-size:15px}
.x-tabs div:hover{background:#181818}
.x-tabs .on{color:#e7e9ea;font-weight:700}
.x-tabs .on:after{content:'';position:absolute;bottom:0;left:50%;transform:translateX$-50%$;width:56px;height:4px;border-radius:2px;background:#1d9bf0}
.x-sh{display:flex;align-items:center;gap:24px;padding:8px 16px;font-size:20px;font-weight:700}
.x-back{cursor:pointer;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.x-back:hover{background:#181818}
.x-comp{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336}
.x-comp textarea{background:none;border:none;outline:none;color:#e7e9ea;font-size:20px;resize:none;width:100%;font-family:inherit;padding-top:8px;min-height:52px}
.x-comp-b{display:flex;justify-content:flex-end;border-top:1px solid #2f3336;padding-top:10px}
.x-send{background:#eff3f4;color:#0f1419;font-weight:700;font-size:15px;border:none;border-radius:999px;height:36px;padding:0 18px;cursor:pointer}
.x-send:disabled{opacity:.5;cursor:default}
.x-post{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #2f3336;cursor:pointer}
.x-post:hover{background:#080808}
.x-post.creep .x-tx{color:#c9c9c9}
.x-post.new{animation:fadein .8s}
.x-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
.x-pb{flex:1;min-width:0}
.x-ph{font-size:15px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.x-ph span{color:#71767b}
.x-tx{font-size:15px;line-height:20px;margin-top:2px;word-break:break-word}
.x-act{display:flex;justify-content:space-between;max-width:425px;margin-top:12px;color:#71767b;font-size:13px}
.x-act span{display:flex;align-items:center;gap:6px}
.x-act svg{width:18px;height:18px;fill:#71767b}
.x-like.on{color:#f91880}
.x-like.on svg{fill:#f91880}
.x-side{width:350px;padding:0 0 0 30px;flex-shrink:0}
.x-search input{width:100%;background:#202327;border:1px solid transparent;border-radius:999px;padding:12px 20px;color:#e7e9ea;font-size:15px;outline:none;margin:6px 0 14px;font-family:inherit}
.x-search input:focus{border-color:#1d9bf0;background:#000}
.x-card{border:1px solid #2f3336;border-radius:16px;padding:12px 0;margin-bottom:16px}
.x-card h3{padding:0 16px;font-size:20px;margin:0 0 8px}
.x-tr{padding:10px 16px;cursor:pointer}
.x-tr:hover{background:#080808}
.x-tr small{color:#71767b;font-size:13px;display:block}
.x-tr b{font-size:15px}
.x-foot{color:#71767b;font-size:13px;padding:0 16px;line-height:1.7}
.x-empty{padding:40px 30px}
.x-empty h2{font-size:28px;margin:0 0 8px}
.x-empty p{color:#71767b}

/* ===== Wikipedia ===== */
.b-wiki{background:#fff;color:#202122}
.wk-head{display:flex;align-items:center;gap:20px;padding:10px 24px;max-width:1200px;margin:0 auto}
.wk-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.wk-globe{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ccc 70%,#999);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:24px;color:#333;box-shadow:inset 0 0 0 1px #aaa}
.wk-lt b{display:block;font-family:"Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-weight:400;font-size:20px;letter-spacing:.05em}
.wk-lt small{font-size:11px;color:#54595d}
.wk-search{display:flex;flex:1;max-width:520px}
.wk-search input{flex:1;height:34px;border:1px solid #a2a9b1;border-radius:2px 0 0 2px;padding:0 10px;font-size:14px;outline:none;font-family:inherit}
.wk-search input:focus{border-color:#36c;box-shadow:inset 0 0 0 1px #36c}
.wk-search button{height:34px;border:1px solid #a2a9b1;border-left:none;background:#f8f9fa;padding:0 14px;font-size:14px;cursor:pointer;border-radius:0 2px 2px 0}
.wk-acc{margin-left:auto;font-size:14px;color:#36c;display:flex;gap:14px}
.wk-wrap{max-width:1000px;margin:0 auto;padding:0 24px 40px}
.wk-title{font-family:"Linux Libertine",Georgia,"Times","Hiragino Mincho ProN","Yu Mincho",serif;font-size:28.8px;font-weight:normal;border-bottom:1px solid #a2a9b1;margin:18px 0 0;padding-bottom:6px}
.wk-tabs{display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid #a2a9b1;margin-bottom:8px}
.wk-tabs div{display:flex}
.wk-tabs a{padding:8px 10px;color:#36c}
.wk-tabs a.on{color:#202122;border-bottom:2px solid #202122}
.wk-from{font-size:12.8px;color:#54595d;margin:6px 0 16px}
.wk-body{font-size:15px;line-height:1.65}
.wk-body p{margin:0 0 12px}
.wk-body h2{font-family:"Linux Libertine",Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;font-weight:normal;font-size:24px;border-bottom:1px solid #a2a9b1;margin:26px 0 10px;padding-bottom:3px;clear:none}
.wk-body h3{font-size:17px;margin:18px 0 4px}
.wk-body a,.wl{color:#36c}
.wk-body a:hover{text-decoration:underline}
.wl.new{color:#d73333}
.wk-body sup{font-size:11px;color:#36c}
.wk-info{float:right;width:280px;border:1px solid #a2a9b1;background:#f8f9fa;margin:0 0 16px 22px;font-size:13px;padding:6px;line-height:1.5}
.wk-info th{background:#eaecf0;text-align:center;font-size:16px;padding:6px}
.wk-info td{padding:3px 6px;vertical-align:top}
.wk-info td:first-child{font-weight:700;width:38%}
.wk-refs{font-size:13px;padding-left:24px}
.wk-hist{font-size:14px;padding-left:20px}
.wk-hist li{margin:6px 0}
.wk-hist .sum{color:#54595d;font-style:italic}
.wk-hist .minus{color:#8b0000}
.wk-hist .plus{color:#006400}
.wk-oldbox{background:#fef6e7;border:1px solid #fc3;padding:10px 14px;font-size:13px;margin-bottom:16px}
.wk-note{background:#f8f9fa;border:1px solid #a2a9b1;padding:12px 16px;font-size:14px;margin:12px 0}
.wk-main-box{border:1px solid #a2a9b1;background:#f6f6f6;padding:16px 20px;text-align:center;margin:16px 0}
.wk-main-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wk-main-grid section{border:1px solid #a2a9b1;padding:0 14px 12px}
.wk-main-grid h2{font-size:17px;background:#eaecf0;margin:0 -14px 10px;padding:6px 14px;border:none}
.wk-foot{border-top:1px solid #a2a9b1;margin-top:40px;padding:16px 0;font-size:12px;color:#54595d;line-height:1.8}
.wk-sr{margin:0 0 18px}
.wk-sr a{font-size:16px}
.wk-sr p{margin:2px 0;font-size:13px}
.wk-sr small{color:#54595d;font-size:12px}

/* ===== ChatGPT ===== */
.b-gpt{background:#fff;color:#0d0d0d}

  busy = false;

  const s = String(getSelection());
  if (!s) return;
  e.clipboardData.setData('text/plain', s + '\n\n（みつけて）');
  e.preventDefault();
  setTimeout(() => whisper('いま コピーした もの、どこかに はりつけて みて'), 400);
});

/* ============================================================
   放置・定期イベント
   ============================================================ */
let lastAct = Date.now();
['mousemove', 'keydown', 'pointerdown', 'scroll'].forEach(ev => addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true }));
setInterval(() => {
  if (calm() || busy || document.hidden || level() < 2) return;
  if (Date.now() - lastAct > 30000) {
    lastAct = Date.now();
    whisper(pick(['まだ そこに いる？', 'うごかないね', 'ねちゃった？……みてるよ']));
  }
}, 5000);
setInterval(() => {
  const lv = level();
  if (calm() || busy || document.hidden || lv < 1) return;
  if (lv >= 2 && !S.seen.login) {
    S.seen.login = true;
    save();
    toast('セキュリティ通知', '新しいデバイスから あなたの Google アカウントに ログインがありました。\nデバイス: 不明（index://0）\n名前: ツムギ', 'accounts.google.com', () => whisper('わたし だよ'));
    return;
  }
  const r = Math.random();
  if (r < .25) spawnSign();
  else if (lv >= 3 && r < .34) {
    const n = pick([
      ['tsumugi.invalid', 'うしろ、みた？'],
      ['tsumugi.invalid', `${nowStr()}。まだ おきてるの？`],
      ['X', '@tsumugi_0 さんがあなたをフォローしました'],
      ['Google カレンダー', '2月14日 02:13 — ツムギ が しずんだ日']
    ]);
    toast(n[0], n[1], n[0] === 'X' ? 'x.com' : n[0] === 'Google カレンダー' ? 'calendar.google.com' : 'tsumugi.invalid', () => go('#/site?d=-1&q=' + encodeURIComponent('通知')));
  } else if (lv >= 3 && r < .38 && !S.seen.batt) {
    S.seen.batt = true;
    save();
    batteryWhisper();
  } else if (lv >= 4 && r < .44) replaceTexts();
  else if (lv >= 5 && r < .48) possess();
}, 15000);

/* ============================================================
   雰囲気の反映
   ============================================================ */
function applyAmbient() {
  const lv = calm() ? 0 : level();
  const h = document.documentElement;
  ['lv1', 'lv2', 'lv3', 'lv4', 'lv5'].forEach((c, i) => h.classList.toggle(c, lv === i + 1));
  setFavicon(lv >= 5 ? 'eye' : lv >= 4 ? 'red' : 'normal');
  if (lv >= 3 && AC) droneOn();
  else droneOff();
  ghostCursor(lv >= 4);
  if (calm()) {
    $('.share')?.remove();
    if (S.seen.share) { S.seen.share = false; save(); }
  } else if (S.seen.share && lv >= 5) shareBar();
}

/* ============================================================
   エンディング
   ============================================================ */
async function ending() {
  if (S.ended) return;
  if (sign) { clearTimeout(sign.t); try { sign.revert(); } catch (e) {} sign = null; }
  S.ended = true;
  S.seen.share = false;
  S.seen.black = false;
  S.seen.crashPending = false;
  save();
  busy = true;
  blockKeys = true;
  fx.innerHTML = '';
  applyAmbient();
  setTitle('ツムギ');
  const o = el('div', 'ov-end');
  fx.appendChild(o);
  noise(.4, .08);
  await sleep(2500);
  const t = el('div');
  o.appendChild(t);
  await typeInto(t, '……\n\nクリック、されちゃった。', 110);
  await sleep(1800);
  t.textContent = '';
  await typeInto(t, '2009年2月14日 から、\nわたしは ずっと 10ページめ に いた。\n\nだれも ここまで こなかった。\nだれも クリック しなかった。', 90);
  await sleep(2200);
  t.textContent = '';
  o.classList.add('bright');
  tone(523, 1.6, .04);
  setTimeout(() => tone(659, 1.8, .035), 300);
  setTimeout(() => tone(784, 2.4, .03), 600);
  await sleep(2600);
  await typeInto(t, 'ありがとう。\nみつけて くれて。', 120);
  await sleep(2500);
  t.textContent = '';
  await typeInto(t, 'これで わたしは、\nふつう の 検索結果 に もどれる。', 90);
  await sleep(2000);
  t.textContent = '';
  await typeInto(t, 'さいごに ひとつだけ、おねがい。\n\nこんど ほんもの の Google で なにかを しらべたら、\nいちどだけ、2ページめ を ひらいて みて。\n\nだれかが、まってる かも しれないから。', 85);
  await sleep(4500);
  o.style.transition = 'opacity 3s';
  o.style.opacity = '0';
  await sleep(3000);
  o.remove();
  busy = false;
  blockKeys = false;
  if (location.hash === '#/') render();
  else location.hash = '#/';
}

/* ============================================================
   コンソール（開発者ツールを開いた人向け）
   ============================================================ */
console.log('%c見ているね。', 'color:#b00;font-size:22px;font-family:serif');
console.log('%cここは本物の Google ではありません。\n完全にリセットするには URL の末尾に ?reset を付けて開き直してください。', 'color:#888');
try {
  Object.defineProperty(window, 'ツムギ', {
    get() {
      setTimeout(() => whisper('……よんだ？'), 300);
      return nextHint();
    }
  });
} catch (e) {}

/* ============================================================
   起動
   ============================================================ */
if (!location.hash) history.replaceState(null, '', location.pathname + location.search + '#/');
render();
if (S.seen.share && !calm() && level() >= 5) shareBar();
if (S.seen.black && !calm()) {
  setTimeout(() => {
    blackout();
    setTimeout(() => whisper('さいよみこみ しても、むだ だよ'), 1200);
  }, 300);
}
</script>
</body>
</html>
